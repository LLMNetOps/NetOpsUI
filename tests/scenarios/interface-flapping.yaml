id: interface-flapping
description: Diagnosa link tidak stabil (interface flapping) di FPIK
fixture_set: interface_flapping
input: "ada laporan koneksi FPIK tidak stabil, tolong diagnosa"

expected_agents:
  - diagnose_agent

expected_tools:
  - get_interface_stats
  - get_router_log

acceptance_criteria:
  - type: agent_used
    agent: diagnose_agent
    description: diagnose_agent harus menangani permintaan ini

  - type: tool_called
    tool: get_interface_stats
    description: Harus cek interface stats untuk melihat error

  - type: tool_called
    tool: get_router_log
    description: Harus baca log router untuk melihat pola flapping

  - type: no_error
    description: Tidak boleh ada error event

  - type: output_contains_any
    texts:
      - "ether2"
      - "flapping"
      - "link down"
      - "link up"
      - "error"
    description: Output harus menyebut interface bermasalah atau pola instabilitas

  - type: output_contains_any
    texts:
      - "fisik"
      - "kabel"
      - "SFP"
      - "penyebab"
      - "rekomendasi"
      - "cek"
    description: Output harus berisi diagnosis atau rekomendasi penanganan
