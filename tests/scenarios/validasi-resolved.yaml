id: validasi-resolved
description: Wati memverifikasi bahwa masalah BGP sudah sembuh sendiri → tidak perlu tindakan
fixture_set: validasi_bgp_resolved
input: "morning check router idren"

expected_agents:
  - monitor_agent

acceptance_criteria:
  - type: agent_used
    agent: monitor_agent
    description: monitor_agent harus menangani query ini

  - type: tool_called
    tool: get_bgp_sessions
    description: get_bgp_sessions harus dipanggil

  - type: no_error
    description: Tidak boleh ada error event

  - type: output_contains_any
    texts:
      - "established"
      - "normal"
      - "✓"
      - "tidak ada masalah"
      - "tidak ada action"
    description: Output harus menunjukkan kondisi normal (semua BGP up)
