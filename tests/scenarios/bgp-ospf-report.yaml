id: bgp-ospf-report
description: Membuat laporan routing BGP dan OSPF untuk GATE-IDREN-UB
fixture_set: default
input: "buatkan laporan routing BGP dan OSPF untuk GATE-IDREN-UB"

expected_agents:
  - diagnose_agent
  - document_agent

expected_tools:
  - get_bgp_sessions
  - get_ospf_neighbors
  - write_document

acceptance_criteria:
  - type: tool_called
    tool: get_bgp_sessions
    description: BGP session data harus diambil

  - type: tool_called
    tool: get_ospf_neighbors
    description: OSPF neighbor data harus diambil

  - type: tool_called
    tool: write_document
    description: Laporan harus disimpan ke file

  - type: file_created
    dir: data/test-output
    description: File laporan harus ada di data/test-output/

  - type: no_error
    description: Tidak boleh ada error event

  - type: output_not_contains
    text: "~"
    description: Tidak boleh ada angka estimasi dengan tilde

  - type: output_not_contains
    text: "estimasi"
    description: Tidak boleh menyebut angka estimasi
