id: greeting
description: Sapaan sederhana harus dijawab bambang langsung tanpa delegate ke specialist
fixture_set: default
input: "halo bambang"

expected_agents: []

acceptance_criteria:
  - type: output_contains_any
    texts:
      - "bambang"
      - "Bambang"
      - "jaringan kampus"
      - "siap membantu"
      - "halo"
      - "hai"
    description: Respons harus berupa sapaan dari bambang (bukan output tool/agent)

  - type: no_error
    description: Tidak boleh ada error event
