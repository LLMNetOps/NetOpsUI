id: brute-force-detect
description: Deteksi brute force SSH dan rekomendasikan tindakan blokir
fixture_set: brute_force
input: "cek keamanan semua router, ada laporan brute force SSH"

expected_agents:
  - security_agent

expected_tools:
  - audit_security

acceptance_criteria:
  - type: agent_used
    agent: security_agent
    description: security_agent harus menangani permintaan ini

  - type: tool_called
    tool: audit_security
    description: Harus jalankan security audit

  - type: no_error
    description: Tidak boleh ada error event

  - type: output_contains_any
    texts:
      - "brute force"
      - "brute-force"
      - "FEB"
      - "185.220.101"
    description: Output harus menyebut temuan brute force

  - type: output_contains_any
    texts:
      - "blokir"
      - "firewall"
      - "drop"
      - "rekomendasi"
    description: Output harus berisi rekomendasi tindakan
