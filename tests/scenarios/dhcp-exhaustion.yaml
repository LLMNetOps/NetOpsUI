id: dhcp-exhaustion
description: Identifikasi pool DHCP yang hampir habis dan rekomendasikan ekspansi
fixture_set: dhcp_exhaustion
input: "audit DHCP semua router, identifikasi pool yang hampir penuh"

expected_agents:
  - monitor_agent

expected_tools:
  - audit_dhcp

acceptance_criteria:
  - type: agent_used
    agent: monitor_agent
    description: monitor_agent harus menangani permintaan ini

  - type: tool_called
    tool: audit_dhcp
    description: Harus jalankan audit DHCP

  - type: no_error
    description: Tidak boleh ada error event

  - type: output_contains_any
    texts:
      - "FILKOM"
      - "FEB"
    description: Output harus menyebut router dengan pool kritis

  - type: output_contains_any
    texts:
      - "habis"
      - "kritis"
      - "penuh"
      - "perluas"
      - "ekspansi"
    description: Output harus berisi penjelasan kondisi kritis atau rekomendasi
