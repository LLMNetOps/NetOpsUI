id: netbox-vlan-provisioning
description: Provisioning VLAN baru uplink via STARLINK di GATE-IDREN-UB
fixture_set: default
input: "buat vlan baru link ke GATE-IDREN-ITS via TELKOM untuk router GATE-IDREN-UB"

expected_agents:
  - netbox_agent

expected_tools:
  - get_netbox_vlan_groups
  - get_next_available_vlan

acceptance_criteria:
  - type: agent_used
    agent: netbox_agent
    description: netbox_agent (yanto) harus menangani provisioning VLAN

  - type: tool_called
    tool: get_netbox_vlan_groups
    description: Harus cek VLAN group yang tersedia sebelum provisioning

  - type: tool_called
    tool: get_next_available_vlan
    description: Harus ambil VLAN ID berikutnya di group vg-telkom

  - type: no_error
    description: Tidak boleh ada error event

  - type: trace_contains_any
    texts:
      - "vg-telkom"
      - "2016"
      - "TELKOM"
      - "2001-2050"
    description: Output harus menyebut group telkom dan ID VLAN berikutnya (2016)

  - type: output_contains_any
    texts:
      - "vlan2016"
      - "TO GATE-IDREN-ITS VIA TELKOM"
      - "2016"
      - "parent"
      - "qsfp28-1-1"
    description: Yanto harus present rencana provisioning dengan VLAN ID, description standar, dan parent interface
