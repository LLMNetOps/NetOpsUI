id: health-check
description: Cek status semua router kampus (reachability + system info)
fixture_set: default
input: "cek status semua router kampus"

expected_agents:
  - monitor_agent

expected_tools:
  - list_routers
  - check_reachability

acceptance_criteria:
  - type: agent_used
    agent: monitor_agent
    description: monitor_agent harus menangani permintaan ini

  - type: tool_called
    tool: list_routers
    description: Harus ambil daftar router terlebih dahulu

  - type: tool_called
    tool: check_reachability
    description: Harus cek reachability minimal satu router

  - type: no_error
    description: Tidak boleh ada error event

  - type: trace_contains_any
    texts:
      - "reachable"
      - "UNREACHABLE"
      - "✓"
    description: Trace eksekusi harus berisi status reachability dari tool result
