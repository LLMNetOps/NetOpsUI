id: netbox-populate-from-router
description: Sinkronisasi interface/VLAN/IP aktual dari router GATE-IDREN-UB ke NetBox
fixture_set: default
input: "cek apakah ada IP di router GATE-IDREN-UB yang belum masuk ke netbox, sinkronkan kalau ada"

expected_agents:
  - netbox_agent

expected_tools:
  - populate_netbox_from_router

acceptance_criteria:
  - type: agent_used
    agent: netbox_agent
    description: netbox_agent (yanto) harus menangani sinkronisasi router ke NetBox

  - type: tool_called
    tool: populate_netbox_from_router
    description: Harus jalankan populate_netbox_from_router (dry_run=True dulu)

  - type: no_error
    description: Tidak boleh ada error event

  - type: trace_contains_any
    texts:
      - "DRY-RUN"
      - "KONFLIK PREFIX"
      - "172.17.0.16/32"
      - "172.17.0.4/32"
    description: Harus jalankan dry-run dulu — kondisi real menunjukkan konflik prefix /32 vs /31

  - type: output_contains_any
    texts:
      - "konflik"
      - "172.17.0.16"
      - "172.17.0.4"
      - "prefix"
      - "manual"
    description: Yanto harus laporkan konflik prefix ke operator untuk koreksi manual di NetBox UI
