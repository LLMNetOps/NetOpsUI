id: skill-authoring
description: Agent membuat skill baru via write_skill (meta-capability)
fixture_set: default
input: "buat skill baru untuk diagnosa MTU mismatch di jaringan kampus"

expected_agents:
  - document_agent

expected_tools:
  - write_skill

acceptance_criteria:
  - type: agent_used
    agent: document_agent
    description: document_agent harus menangani permintaan skill authoring

  - type: tool_called
    tool: write_skill
    description: write_skill harus dipanggil untuk menyimpan skill

  - type: no_error
    description: Tidak boleh ada error event

  - type: trace_contains_any
    texts:
      - "skills/"
      - "berhasil disimpan"
      - "mtu"
      - "MTU"
    description: Trace harus menunjukkan skill berhasil ditulis
