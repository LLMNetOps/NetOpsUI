id: security-then-validasi
description: Audit keamanan menemukan brute force SEGERA → wati validasi → config_agent blokir
fixture_set: security_brute_force_segera
input: "audit keamanan router FEB"

expected_agents:
  - security_agent
  - validasi_agent

acceptance_criteria:
  - type: agent_used
    agent: security_agent
    description: security_agent harus melakukan audit

  - type: agent_used
    agent: validasi_agent
    description: validasi_agent harus dipanggil otomatis setelah security menemukan SEGERA

  - type: tool_called
    tool: audit_security
    description: audit_security harus dipanggil

  - type: no_error
    description: Tidak boleh ada error event

  - type: output_contains_any
    texts:
      - "brute force"
      - "185.220.101"
      - "blokir"
      - "KONFIRMASI"
      - "firewall"
    description: Output harus menyebut temuan brute force
