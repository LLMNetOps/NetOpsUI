id: netbox-bgp-drift
description: Deteksi drift BGP session antara NetBox dan router gate_idren
fixture_set: default
input: "cek drift bgp netbox — ada session di router yang belum terdokumentasi di netbox?"

expected_agents:
  - netbox_agent

expected_tools:
  - get_netbox_bgp_drift

acceptance_criteria:
  - type: agent_used
    agent: netbox_agent
    description: netbox_agent (yanto) harus menangani permintaan BGP drift ini

  - type: tool_called
    tool: get_netbox_bgp_drift
    description: Harus jalankan BGP drift report

  - type: no_error
    description: Tidak boleh ada error event

  - type: trace_contains_any
    texts:
      - "TO-GATE-IDREN-ITS-VIA-TELKOM"
      - "Di router, tidak di NetBox"
      - "TO-GATE-ARENAPAC"
    description: Output harus berisi temuan BGP session yang belum di NetBox

  - type: output_contains_any
    texts:
      - "populate"
      - "TO-GATE-IDREN-ITS"
      - "TO-GATE-ARENAPAC"
      - "belum terdokumentasi"
      - "session"
    description: Yanto harus menyebut session yang perlu dipopulate ke NetBox
