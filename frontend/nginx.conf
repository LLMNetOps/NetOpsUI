server {
    listen 80;
    server_name _;

    # SPA — serve index.html for all non-API/static routes.
    # Host files are volume-mounted for hot reload during dev, but browsers
    # heuristically cache JS/CSS with no Cache-Control header, so an edit
    # here can silently keep serving a stale bundle from the browser cache
    # even across a normal reload. Force revalidation on every request.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Proxy existing chat/session endpoints to backend
    location ~ ^/(chat|approve|info|metrics|session) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE support — critical for streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # Proxy /api/* endpoints to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
    }
}
