<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>LLMNetOps - Enterprise Console</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      colors: {
        "primary":"#002444","on-primary":"#ffffff","primary-container":"#1b3a5c",
        "on-primary-container":"#87a4cc","secondary":"#94492d","on-secondary":"#ffffff",
        "secondary-container":"#fe9d7b","on-secondary-container":"#773218",
        "tertiary":"#142438","tertiary-container":"#2a3a4e",
        "error":"#ba1a1a","on-error":"#ffffff","error-container":"#ffdad6",
        "surface":"#f7f9fc","surface-dim":"#d8dadd","surface-bright":"#f7f9fc",
        "surface-container-lowest":"#ffffff","surface-container-low":"#f2f4f7",
        "surface-container":"#eceef1","surface-container-high":"#e6e8eb",
        "surface-container-highest":"#e0e3e6",
        "on-surface":"#191c1e","on-surface-variant":"#43474e",
        "outline":"#73777f","outline-variant":"#c3c6cf",
        "background":"#f7f9fc","on-background":"#191c1e",
        "inverse-surface":"#2d3133","inverse-on-surface":"#eff1f4",
      },
      spacing: {
        sidebar_width:"240px",header_height:"56px",container_gutter:"24px",
        stack_gap_sm:"4px",stack_gap_md:"12px",stack_gap_lg:"24px",
      },
      fontFamily: {
        "display-lg":["IBM Plex Sans"],  "headline-md":["IBM Plex Sans"],
        "title-sm":["IBM Plex Sans"],    "body-md":["IBM Plex Sans"],
        "body-sm":["IBM Plex Sans"],     "label-caps":["IBM Plex Sans"],
        "data-mono":["IBM Plex Mono"],   "data-mono-sm":["IBM Plex Mono"],
      },
      fontSize: {
        "display-lg":["30px",{lineHeight:"38px",letterSpacing:"-0.02em",fontWeight:"600"}],
        "headline-md":["24px",{lineHeight:"32px",fontWeight:"600"}],
        "title-sm":["18px",{lineHeight:"24px",fontWeight:"500"}],
        "body-md":["14px",{lineHeight:"20px",fontWeight:"400"}],
        "body-sm":["13px",{lineHeight:"18px",fontWeight:"400"}],
        "label-caps":["11px",{lineHeight:"16px",letterSpacing:"0.05em",fontWeight:"700"}],
        "data-mono":["13px",{lineHeight:"18px",fontWeight:"450"}],
        "data-mono-sm":["11px",{lineHeight:"14px",fontWeight:"450"}],
      },
    },
  },
}
</script>
<link rel="stylesheet" href="/css/app.css"/>
</head>
<body class="text-on-surface">
<div id="app"></div>
<script type="module" src="/js/app.js"></script>
</body>
</html>
