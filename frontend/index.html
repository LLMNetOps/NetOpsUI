<style>
/* ============================================================
   NetOps AI — Color & Type Tokens
   Dark theme only. NOC console / precision instrument aesthetic.
   ============================================================ */

@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/IBMPlexMono-Regular.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/IBMPlexMono-Medium.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/IBMPlexMono-SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('fonts/IBMPlexSans-Regular.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/IBMPlexSans-Medium.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans Condensed'; font-style: normal; font-weight: 500; font-display: swap; src: url('fonts/IBMPlexSansCondensed-Medium.woff2') format('woff2'); }
@font-face { font-family: 'IBM Plex Sans Condensed'; font-style: normal; font-weight: 600; font-display: swap; src: url('fonts/IBMPlexSansCondensed-SemiBold.woff2') format('woff2'); }

:root {
  --bg-0: #08090b;
  --bg-1: #0e1014;
  --bg-2: #15181e;
  --bg-3: #1c2028;
  --border-1: #252932;
  --border-2: #363b46;
  --fg-0: #e8eaee;
  --fg-1: #a8aeba;
  --fg-2: #6c7280;
  --fg-3: #454a55;
  --ok: #7ee787;
  --ok-dim: #2d4a32;
  --warn: #f0b85c;
  --warn-dim: #4a3a1c;
  --err: #ff7b72;
  --err-dim: #4a1f1f;
  --info: #79c0ff;
  --info-dim: #1c3147;
  --agent-bambang: #d2a8ff;
  --agent-eko: #7ee787;
  --agent-agus: #79c0ff;
  --agent-joko: #ffa657;
  --agent-satria: #ff7b72;
  --agent-budi: #a8c7fa;
  --state-standby: var(--fg-2);
  --state-antrean: var(--info);
  --state-berjalan: var(--ok);
  --state-menunggu: var(--warn);
  --state-selesai: var(--fg-1);
  --state-gagal: var(--err);
  --font-mono: 'IBM Plex Mono', ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace;
  --font-sans: 'IBM Plex Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-cond: 'IBM Plex Sans Condensed', 'IBM Plex Sans', system-ui, sans-serif;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px; --sp-6: 24px; --sp-8: 32px; --sp-12: 48px;
  --r-0: 0; --r-1: 2px; --r-full: 9999px;
  --shadow-elev: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px var(--border-1);
  --shadow-glow-ok: 0 0 6px rgba(126,231,135,0.6);
  --shadow-glow-warn: 0 0 6px rgba(240,184,92,0.6);
  --shadow-glow-err: 0 0 6px rgba(255,123,114,0.6);
  --t-fast: 120ms cubic-bezier(0.2,0,0,1);
  --t-base: 180ms cubic-bezier(0.2,0,0,1);
  --t-modal: 320ms cubic-bezier(0.2,0,0,1);
}

html, body { background: var(--bg-0); color: var(--fg-0); font-family: var(--font-mono); font-size: 13px; line-height: 1.45; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

.t-display { font-family: var(--font-cond); font-weight: 500; font-size: 32px; line-height: 1.1; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.t-h1 { font-family: var(--font-cond); font-weight: 500; font-size: 22px; line-height: 1.2; }
.t-h2 { font-family: var(--font-cond); font-weight: 500; font-size: 16px; line-height: 1.3; text-transform: uppercase; letter-spacing: 0.06em; }
.t-h3 { font-family: var(--font-cond); font-weight: 500; font-size: 13px; line-height: 1.4; text-transform: uppercase; letter-spacing: 0.08em; }
.t-body { font-family: var(--font-sans); font-weight: 400; font-size: 14px; line-height: 1.5; }
.t-data { font-family: var(--font-mono); font-weight: 400; font-size: 13px; line-height: 1.45; }
.t-data-sm { font-family: var(--font-mono); font-weight: 400; font-size: 12px; line-height: 1.4; }
.t-num { font-family: var(--font-mono); font-weight: 500; font-variant-numeric: tabular-nums; font-size: 13px; }
.t-label { font-family: var(--font-cond); font-weight: 500; font-size: 11px; line-height: 1.3; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-2); }
.t-tag { font-family: var(--font-mono); font-weight: 500; font-size: 10px; line-height: 1.2; text-transform: uppercase; letter-spacing: 0.05em; }
.t-dim { color: var(--fg-2); } .t-fg1 { color: var(--fg-1); } .t-ok { color: var(--ok); } .t-warn { color: var(--warn); } .t-err { color: var(--err); } .t-info { color: var(--info); }

/* ============================================================
   Web Dashboard styles
   ============================================================ */

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100vh; overflow: hidden; }

body::before {
  content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 9999;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,0.018) 0 1px, transparent 1px 3px);
}

.app { display: grid; grid-template-rows: 40px 1fr 24px; height: 100vh; }

/* TOP BAR */
.topbar { display: flex; align-items: center; padding: 0 16px; gap: 16px; background: var(--bg-1); border-bottom: 1px solid var(--border-1); font-size: 12px; }
.topbar-left { display: flex; align-items: center; gap: 12px; }
.topbar-right { margin-left: auto; display: flex; align-items: center; gap: 18px; }
.logo { font-family: var(--font-mono); font-weight: 500; font-size: 14px; color: var(--fg-0); display: inline-flex; gap: 1px; align-items: center; }
.logo span { color: var(--fg-0); }
.logo i { color: var(--ok); font-style: normal; padding: 0 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-ok { background: var(--ok); }
.topbar-thread { color: var(--fg-1); font-size: 12px; }
.tb-meta { display: inline-flex; gap: 6px; align-items: center; font-family: var(--font-mono); }
.tb-meta .lbl { font-family: var(--font-cond); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-2); }
.tb-meta .val { color: var(--fg-0); font-variant-numeric: tabular-nums; }

/* MAIN */
.main { display: grid; grid-template-columns: 64px 1fr 360px; height: 100%; min-height: 0; }

/* LEFT RAIL */
.leftrail { background: var(--bg-1); border-right: 1px solid var(--border-1); display: flex; flex-direction: column; padding: 8px 0; gap: 1px; }
.rail-btn { background: transparent; border: none; color: var(--fg-2); padding: 12px 6px; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; transition: background 120ms, color 120ms; border-left: 2px solid transparent; width: 100%; }
.rail-btn:hover { background: var(--bg-2); color: var(--fg-1); }
.rail-active { background: var(--bg-2); color: var(--fg-0); border-left-color: var(--ok); }
.rail-glyph { font-size: 18px; line-height: 1; }
.rail-label { font-family: var(--font-cond); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; }

/* CHAT PANEL */
.chat-panel { display: grid; grid-template-rows: 36px 1fr auto; min-height: 0; background: var(--bg-0); }
.chat-head { display: flex; align-items: center; padding: 0 16px; gap: 14px; border-bottom: 1px solid var(--border-1); background: var(--bg-1); }
.chat-head-title { font-family: var(--font-cond); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-1); }
.chat-head-meta { color: var(--fg-2); font-size: 11px; font-family: var(--font-mono); }
.chat-head-btns { margin-left: auto; display: flex; gap: 8px; }

.chat-stream { padding: 16px 20px 24px; overflow-y: auto; font-family: var(--font-mono); font-size: 13px; line-height: 1.6; min-height: 0; }
.chat-stream::-webkit-scrollbar { width: 8px; }
.chat-stream::-webkit-scrollbar-track { background: var(--bg-0); }
.chat-stream::-webkit-scrollbar-thumb { background: var(--border-1); }

.ch-line { white-space: pre-wrap; }
.ch-block { margin: 8px 0; padding: 10px 12px; background: var(--bg-1); border-left: 1px solid var(--border-2); }
.ch-you { color: var(--ok); font-weight: 500; }
.ch-user-text { color: var(--fg-0); }
.ch-ev { color: var(--fg-2); }
.ch-ok { color: var(--ok); }
.ch-err { color: var(--err); }
.ch-warn { color: var(--warn); }
.ch-ai { color: var(--warn); font-weight: 500; }
.ch-ai-body { color: var(--fg-0); }
.ch-ai-cont { color: var(--fg-0); padding-left: 6ch; }
.ch-dim { color: var(--fg-3); }
.ch-caret { display: inline-block; width: 7px; height: 13px; background: var(--fg-0); vertical-align: -2px; margin-left: 1px; animation: blink 1s step-start infinite; }
@keyframes blink { 50% { opacity: 0; } }
.ch-approval { padding: 8px 10px; background: rgba(74,58,28,0.3); border: 1px solid var(--warn); margin: 6px 0; }

.ch-meter { display: flex; gap: 14px; padding: 6px 0 0; margin-top: 6px; border-top: 1px dashed var(--border-1); font-size: 10px; color: var(--fg-2); font-family: var(--font-mono); }
.ch-meter span { display: inline-flex; gap: 4px; align-items: center; }
.ch-meter i { font-style: normal; font-family: var(--font-cond); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-size: 9px; }
.ch-meter b { font-weight: 500; color: var(--fg-1); font-variant-numeric: tabular-nums; }

/* COMPOSER */
.composer { display: grid; grid-template-columns: 30px 1fr auto; gap: 0; align-items: stretch; background: var(--bg-1); border-top: 1px solid var(--border-1); padding: 12px 16px; }
.comp-prompt { font-family: var(--font-mono); font-size: 14px; color: var(--ok); padding-top: 6px; font-weight: 600; }
.comp-input { background: var(--bg-2); border: 1px solid var(--border-1); color: var(--fg-0); padding: 8px 10px; font-family: var(--font-mono); font-size: 13px; resize: none; outline: none; line-height: 1.5; }
.comp-input:focus { border-color: var(--border-2); }
.comp-input::placeholder { color: var(--fg-3); }
.comp-side { display: flex; flex-direction: column; gap: 6px; align-items: flex-end; padding-left: 14px; justify-content: space-between; }
.comp-hint { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); display: inline-flex; gap: 4px; align-items: center; }
.comp-hint kbd { background: var(--bg-2); border: 1px solid var(--border-1); padding: 1px 5px; font-family: var(--font-mono); font-size: 10px; color: var(--fg-0); }

/* BUTTONS */
.btn-pri { font-family: var(--font-mono); font-weight: 500; font-size: 12px; padding: 6px 14px; background: var(--bg-3); color: var(--fg-0); border: 1px solid var(--border-2); cursor: pointer; border-radius: 2px; transition: background 120ms; }
.btn-pri:hover { background: var(--border-1); }
.btn-pri:disabled { opacity: 0.4; cursor: not-allowed; }
.btn-ghost { font-family: var(--font-mono); font-weight: 500; font-size: 12px; padding: 6px 14px; background: transparent; color: var(--fg-1); border: 1px solid var(--border-1); cursor: pointer; border-radius: 2px; }
.btn-ghost:hover { background: var(--bg-2); border-color: var(--border-2); }
.btn-warn-fill { font-family: var(--font-mono); font-weight: 600; font-size: 12px; padding: 6px 16px; background: var(--warn); color: var(--bg-0); border: 1px solid var(--warn); cursor: pointer; border-radius: 2px; }
.btn-warn-fill:hover { filter: brightness(1.1); }

/* AGENT RAIL (right) */
.agent-rail { background: var(--bg-0); border-left: 1px solid var(--border-1); display: flex; flex-direction: column; min-height: 0; overflow-y: auto; }
.agent-rail-head { padding: 10px 14px; border-bottom: 1px solid var(--border-1); display: flex; justify-content: space-between; align-items: center; background: var(--bg-1); }
.agent-rail-title { font-family: var(--font-cond); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-1); }
.agent-rail-count { font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); }
.agent-rail-list { display: flex; flex-direction: column; gap: 1px; padding: 1px 0; }

.agent-card { background: var(--bg-1); border: 1px solid var(--border-1); border-left: none; border-right: none; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; position: relative; transition: background 120ms; }
.agent-card:hover { background: var(--bg-2); }
.agent-active { background: var(--bg-2); }

.cb { position: absolute; width: 8px; height: 8px; pointer-events: none; }
.cb1 { left: 0; top: 0; border-left: 1px solid var(--ok); border-top: 1px solid var(--ok); }
.cb2 { right: 0; top: 0; border-right: 1px solid var(--ok); border-top: 1px solid var(--ok); }
.cb3 { left: 0; bottom: 0; border-left: 1px solid var(--ok); border-bottom: 1px solid var(--ok); }
.cb4 { right: 0; bottom: 0; border-right: 1px solid var(--ok); border-bottom: 1px solid var(--ok); }

.agent-head { display: flex; align-items: center; gap: 10px; }
.agent-av { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-weight: 600; font-size: 11px; color: var(--bg-0); border-radius: 2px; }
.agent-name { font-family: var(--font-mono); font-weight: 500; font-size: 13px; color: var(--fg-0); }
.agent-role { font-family: var(--font-cond); font-weight: 500; font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-2); margin-left: auto; }

.agent-state-row { display: flex; align-items: center; gap: 10px; }
.agent-elapsed { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); margin-left: auto; font-variant-numeric: tabular-nums; }

.chip { font-family: var(--font-mono); font-weight: 500; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; padding: 2px 7px; border: 1px solid; display: inline-flex; gap: 6px; align-items: center; line-height: 1.2; }
.chip-dot { width: 6px; height: 6px; border-radius: 50%; }

.agent-task { font-family: var(--font-mono); font-size: 11px; color: var(--fg-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.agent-metrics { display: flex; gap: 12px; font-family: var(--font-mono); font-size: 10px; }
.agent-metrics span { display: inline-flex; gap: 4px; align-items: center; }
.agent-metrics i { font-style: normal; font-family: var(--font-cond); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-size: 9px; }
.agent-metrics b { font-weight: 500; color: var(--fg-0); font-variant-numeric: tabular-nums; }

/* STATUS BAR */
.statusbar { display: flex; align-items: center; padding: 0 16px; background: var(--bg-1); border-top: 1px solid var(--border-1); font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); gap: 14px; }
.sb-state { color: var(--fg-1); }
.sb-spacer { flex: 1; }
.sb-hint { color: var(--fg-2); }
.sb-hint kbd { background: var(--bg-2); border: 1px solid var(--border-1); padding: 0 4px; font-family: var(--font-mono); font-size: 10px; color: var(--ok); margin: 0 4px 0 8px; }

/* MODAL */
.modal-backdrop { position: fixed; inset: 0; background: rgba(8,9,11,0.72); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px); display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadein 180ms cubic-bezier(0.2,0,0,1); }
@keyframes fadein { from { opacity: 0; } }
.modal { width: 580px; background: var(--bg-1); border: 1px solid var(--warn); box-shadow: 0 8px 32px rgba(0,0,0,0.6); position: relative; animation: modalin 220ms cubic-bezier(0.2,0,0,1); }
@keyframes modalin { from { opacity: 0; transform: translateY(8px); } }
.modal .cb1 { border-color: var(--warn); }
.modal .cb2 { border-color: var(--warn); }
.modal .cb3 { border-color: var(--warn); }
.modal .cb4 { border-color: var(--warn); }
.modal-head { background: rgba(74,58,28,0.4); border-bottom: 1px solid var(--warn); padding: 10px 16px; font-family: var(--font-cond); font-weight: 500; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--warn); }
.modal-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
.modal-title { font-family: var(--font-mono); font-size: 14px; color: var(--fg-0); }
.modal-title b { color: var(--agent-joko); font-weight: 500; }
.modal-kv { display: grid; grid-template-columns: 100px 1fr; gap: 6px 14px; font-family: var(--font-mono); font-size: 12px; align-items: start; }
.modal-kv .k { font-family: var(--font-cond); text-transform: uppercase; letter-spacing: 0.08em; font-size: 10px; color: var(--fg-2); padding-top: 2px; }
.modal-kv .v { color: var(--fg-0); }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--border-1); background: var(--bg-0); }
.diff { font-family: var(--font-mono); font-size: 11px; background: var(--bg-0); border: 1px solid var(--border-1); padding: 8px; margin: 0; white-space: pre-wrap; color: var(--fg-1); line-height: 1.5; }
.diff::first-line { color: var(--ok); }

/* TOKEN METER */
.tmeter { display: flex; flex-direction: column; gap: 6px; padding: 8px 0 0; font-family: var(--font-mono); font-size: 11px; }
.tmeter-row { display: flex; align-items: center; gap: 8px; }
.tmeter-l { font-family: var(--font-cond); font-size: 9px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--fg-3); width: 32px; }
.tmeter-track { flex: 1; height: 3px; background: var(--bg-3); border-radius: 2px; overflow: hidden; }
.tmeter-fill { height: 100%; border-radius: 2px; transition: width 400ms ease; }
.tmeter-v { font-variant-numeric: tabular-nums; color: var(--fg-1); width: 36px; text-align: right; }
.tmeter-kpis { display: flex; gap: 12px; padding-top: 4px; }
.tmeter-kpis span { display: inline-flex; gap: 4px; align-items: center; }
.tmeter-kpis i { font-style: normal; font-family: var(--font-cond); text-transform: uppercase; letter-spacing: 0.08em; color: var(--fg-3); font-size: 9px; }
.tmeter-kpis b { font-weight: 500; color: var(--fg-0); font-variant-numeric: tabular-nums; }
</style>

<body>
<div id="root"></div>
<script type="text/babel">
// ============================================================
// NetOps AI Web Dashboard — Components + App
// ============================================================
const { useState, useEffect, useRef } = React;

// ============ TOP BAR ============
function TopBar({ thread, ctx, tokens, time }) {
  return (
    <div className="topbar">
      <div className="topbar-left">
        <div className="logo">[<span>NetOps</span><i>·</i><span>AI</span>]</div>
        <span className="dot dot-ok" style={{boxShadow:'0 0 6px var(--ok)'}}></span>
        <span className="topbar-thread">{thread}</span>
      </div>
      <div className="topbar-right">
        <span className="tb-meta"><span className="lbl">CTX</span><span className="val">{ctx}%</span></span>
        <span className="tb-meta"><span className="lbl">TOK</span><span className="val">{tokens}</span></span>
        <span className="tb-meta"><span className="lbl">MODEL</span><span className="val">qwen3.6:35b</span></span>
        <span className="tb-meta"><span className="lbl">WIB</span><span className="val">{time}</span></span>
      </div>
    </div>
  );
}

// ============ LEFT RAIL ============
function LeftRail({ active, onNav }) {
  const items = [
    { id: 'chat', label: 'AI Chat', glyph: '◆' },
    { id: 'agents', label: 'Agents', glyph: '⊙' },
    { id: 'routers', label: 'Routers', glyph: '◇' },
    { id: 'reports', label: 'Reports', glyph: '▤' },
    { id: 'schedule', label: 'Schedule', glyph: '◷' },
    { id: 'logs', label: 'Logs', glyph: '≡' },
  ];
  return (
    <div className="leftrail">
      {items.map(it => (
        <button key={it.id} className={'rail-btn ' + (active === it.id ? 'rail-active' : '')}
          onClick={() => onNav(it.id)} title={it.label}>
          <span className="rail-glyph">{it.glyph}</span>
          <span className="rail-label">{it.label}</span>
        </button>
      ))}
    </div>
  );
}

// ============ STATUS BAR ============
function StatusBar({ status, hint }) {
  return (
    <div className="statusbar">
      <span className="sb-state">{status}</span>
      <span className="sb-spacer"></span>
      <span className="sb-hint">{hint}</span>
    </div>
  );
}

// ============ CHIPS ============
function StateChip({ state }) {
  const map = {
    STANDBY:  { c: 'var(--fg-2)',  d: 'var(--fg-3)' },
    ANTREAN:  { c: 'var(--info)',  d: 'var(--info)' },
    BERJALAN: { c: 'var(--ok)',    d: 'var(--ok)', glow: true },
    MENUNGGU: { c: 'var(--warn)',  d: 'var(--warn)', glow: true },
    SELESAI:  { c: 'var(--fg-1)', d: 'var(--border-2)' },
    GAGAL:    { c: 'var(--err)',   d: 'var(--err)' },
  };
  const m = map[state] || map.STANDBY;
  return (
    <span className="chip" style={{color: m.c, borderColor: m.d}}>
      <span className="chip-dot" style={{background: m.c, boxShadow: m.glow ? `0 0 6px ${m.c}` : 'none'}}></span>
      {state}
    </span>
  );
}

// ============ AGENT CARD ============
function AgentCard({ agent }) {
  const initials = agent.name[0];
  const isActive = agent.state === 'BERJALAN' || agent.state === 'MENUNGGU';
  return (
    <div className={'agent-card ' + (isActive ? 'agent-active' : '')}>
      {isActive && <><span className="cb cb1"></span><span className="cb cb2"></span><span className="cb cb3"></span><span className="cb cb4"></span></>}
      <div className="agent-head">
        <div className="agent-av" style={{background: agent.color}}>{initials}</div>
        <div className="agent-name">{agent.name}</div>
        <div className="agent-role">{agent.role}</div>
      </div>
      <div className="agent-state-row">
        <StateChip state={agent.state} />
        {agent.elapsed && <span className="agent-elapsed">{agent.elapsed}</span>}
      </div>
      <div className="agent-task" style={agent.taskColor ? {color: agent.taskColor} : null}>
        {agent.task}
      </div>
      {agent.metrics && (
        <div className="agent-metrics">
          {agent.metrics.map((m, i) => (
            <span key={i}><i>{m.l}</i><b>{m.v}</b></span>
          ))}
        </div>
      )}
    </div>
  );
}

// ============ CHAT EVENT ============
function ChatEvent({ ev }) {
  if (ev.type === 'user') {
    return <div className="ch-line"><span className="ch-you">Anda:</span> <span className="ch-user-text">{ev.text}</span></div>;
  }
  if (ev.type === 'route') {
    return <div className="ch-line ch-ev">  ↳ [<span style={{color:'var(--agent-bambang)'}}>bambang</span>] route → <span style={{color:'var(--fg-0)'}}>{ev.to}</span></div>;
  }
  if (ev.type === 'tool-call') {
    return <div className="ch-line ch-ev">  ↳ <span className="ch-ok">[🔧 {ev.tool}{ev.args ? `(${ev.args})` : ''}]</span></div>;
  }
  if (ev.type === 'tool-result') {
    return <div className="ch-line ch-ev">  ↳ <span className="ch-ok">[✓ {ev.tool}{ev.args ? `(${ev.args})` : ''}]</span> <span className="ch-dim">· {ev.tokens} tok · {ev.ms}ms</span></div>;
  }
  if (ev.type === 'tool-error') {
    return <div className="ch-line ch-ev">  ↳ <span className="ch-err">[✗ {ev.tool}]</span> <span className="ch-dim">{ev.err}</span></div>;
  }
  if (ev.type === 'ai') {
    return (
      <div className="ch-block">
        <div className="ch-line"><span className="ch-ai">AI  :</span> <span className="ch-ai-body">{ev.text}</span>{ev.streaming && <span className="ch-caret"></span>}</div>
        {ev.lines && ev.lines.map((l, i) => (
          <div key={i} className="ch-line ch-ai-cont">{l}</div>
        ))}
        {ev.meter && (
          <div className="ch-meter">
            <span><i>ctx</i><b>{ev.meter.ctx}%</b></span>
            <span><i>pred</i><b>{ev.meter.pred}%</b></span>
            <span><i>tps</i><b>{ev.meter.tps}</b></span>
            <span><i>tok</i><b>{ev.meter.tokens}</b></span>
            <span><i>done</i><b style={{color: 'var(--ok)'}}>{ev.meter.done}</b></span>
          </div>
        )}
      </div>
    );
  }
  if (ev.type === 'approval') {
    return (
      <div className="ch-line ch-approval">
        <span className="ch-warn">⚠</span> <span style={{color: 'var(--warn)'}}>joko meminta approval untuk write op</span>
        <span className="ch-dim"> · backup + apply firewall · target DTI</span>
      </div>
    );
  }
  return null;
}

// ============ COMPOSER ============
function Composer({ onSend, disabled }) {
  const [v, setV] = useState('');
  const submit = () => {
    if (!v.trim()) return;
    onSend(v);
    setV('');
  };
  return (
    <div className="composer">
      <div className="comp-prompt">{'>'}</div>
      <textarea
        className="comp-input"
        placeholder="Tanya bambang… (contoh: cek lease di FILKOM, audit firewall DTI, apply rule blocklist)"
        value={v}
        onChange={e => setV(e.target.value)}
        onKeyDown={e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submit(); } }}
        rows={2}
        disabled={disabled}
      />
      <div className="comp-side">
        <span className="comp-hint"><kbd>↵</kbd>send</span>
        <span className="comp-hint"><kbd>⇧↵</kbd>newline</span>
        <button className="btn-pri" onClick={submit} disabled={disabled}>Send</button>
      </div>
    </div>
  );
}

// ============ APPROVAL MODAL ============
function ApprovalModal({ open, data, onApprove, onReject }) {
  if (!open) return null;
  const tool = data?.tool || '—';
  const router = data?.args?.router_name || data?.args?.name || '—';
  const agent = (data?.agent || 'config_agent').replace('_agent', '');
  return (
    <div className="modal-backdrop" onClick={onReject}>
      <div className="modal" onClick={e => e.stopPropagation()}>
        <span className="cb cb1"></span><span className="cb cb2"></span><span className="cb cb3"></span><span className="cb cb4"></span>
        <div className="modal-head">⚠&nbsp;&nbsp;APPROVAL DIPERLUKAN — {agent} / config</div>
        <div className="modal-body">
          <div className="modal-title"><b>{agent}</b> meminta izin tulis ke router <span style={{color:'var(--info)'}}>{router}</span></div>
          <div className="modal-kv">
            <span className="k">TOOL</span><span className="v">{tool}</span>
            <span className="k">TARGET</span><span className="v">{router}</span>
            <span className="k">RISIKO</span><span className="v" style={{color:'var(--warn)'}}>SEDANG — backup otomatis dibuat sebelum eksekusi</span>
            <span className="k">REVERSIBLE</span><span className="v" style={{color:'var(--ok)'}}>ya</span>
          </div>
        </div>
        <div className="modal-actions">
          <button className="btn-ghost" onClick={onReject}>Tolak</button>
          <button className="btn-warn-fill" onClick={onApprove}>Setuju, jalankan</button>
        </div>
      </div>
    </div>
  );
}

// ============ APP ============
const THREAD_ID = crypto.randomUUID();

const AGENTS_DEF = [
  { name: 'bambang', role: 'supervisor', color: '#d2a8ff' },
  { name: 'eko',     role: 'monitor',    color: '#7ee787' },
  { name: 'agus',    role: 'diagnosa',   color: '#79c0ff' },
  { name: 'joko',    role: 'config',     color: '#ffa657' },
  { name: 'satria',  role: 'security',   color: '#ff7b72' },
  { name: 'budi',    role: 'dokumen',    color: '#a8c7fa' },
];

// Alias map: agent definition name → display name
const ALIAS_MAP = { monitor_agent:'eko', diagnose_agent:'agus', config_agent:'joko', security_agent:'satria', document_agent:'budi', supervisor:'bambang' };

function makeAgents() {
  return AGENTS_DEF.map(a => ({ ...a, state: 'STANDBY', task: '— idle —', taskColor: 'var(--fg-3)', metrics: [] }));
}

function formatTime() {
  return new Date().toLocaleTimeString('id-ID', { hour12: false });
}

async function* readSSE(response) {
  const reader = response.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    const lines = buf.split('\n');
    buf = lines.pop();
    for (const line of lines) {
      if (line.startsWith('data: ')) {
        try { yield JSON.parse(line.slice(6)); } catch {}
      }
    }
  }
}

function App() {
  const [active, setActive] = useState('chat');
  const [agents, setAgents] = useState(makeAgents());
  const [events, setEvents] = useState([]);
  const [modalOpen, setModalOpen] = useState(false);
  const [approvalData, setApprovalData] = useState(null);
  const [streaming, setStreaming] = useState(false);
  const [time, setTime] = useState(formatTime());
  const streamRef = useRef(null);

  useEffect(() => {
    const t = setInterval(() => setTime(formatTime()), 1000);
    return () => clearInterval(t);
  }, []);

  useEffect(() => {
    if (streamRef.current) streamRef.current.scrollTop = streamRef.current.scrollHeight;
  }, [events]);

  function agentNameFromSource(source) {
    // source like "[eko] tool_call" or "eko"
    const m = source.match(/\[([^\]]+)\]/);
    const raw = m ? m[1] : source;
    return ALIAS_MAP[raw] || raw;
  }

  function setAgentState(name, patch) {
    setAgents(prev => prev.map(a => a.name === name ? { ...a, ...patch } : a));
  }

  function resetAgents() {
    setAgents(makeAgents());
  }

  async function consumeStream(endpoint, body) {
    setStreaming(true);
    try {
      const res = await fetch(endpoint, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) {
        setEvents(e => [...e, { type: 'error', content: `HTTP ${res.status}` }]);
        return;
      }
      for await (const ev of readSSE(res)) {
        handleServerEvent(ev);
        if (ev.type === 'approval_required') break;
      }
    } catch (err) {
      setEvents(e => [...e, { type: 'error', content: String(err) }]);
    } finally {
      setStreaming(false);
    }
  }

  function handleServerEvent(ev) {
    const { type, content } = ev;

    if (type === 'routing') {
      // content: "[bambang] route → eko" or similar
      const m = content.match(/route\s*[→>]\s*(\w+)/i);
      const target = m ? (ALIAS_MAP[m[1]] || m[1]) : null;
      if (target) setAgentState(target, { state: 'BERJALAN', task: '⠹ berjalan…', taskColor: null });
      setEvents(e => [...e, { type: 'routing', content }]);

    } else if (type === 'tool_call') {
      const agentName = agentNameFromSource(content);
      const tool = content.replace(/^\[[^\]]+\]\s*/, '');
      setAgentState(agentName, { state: 'BERJALAN', task: `⠹ ${tool}`, taskColor: null });
      setEvents(e => [...e, { type: 'tool_call', content: tool, agent: agentName }]);

    } else if (type === 'tool_result') {
      const agentName = agentNameFromSource(content);
      const tool = content.replace(/^\[[^\]]+\]\s*/, '').split(/\s/)[0];
      setAgentState(agentName, { task: `✓ ${tool}` });
      setEvents(e => [...e, { type: 'tool_result', content, agent: agentName }]);

    } else if (type === 'ai') {
      agents.forEach(a => {
        if (a.state === 'BERJALAN') setAgentState(a.name, { state: 'SELESAI', task: '✓ selesai', taskColor: null });
      });
      setEvents(e => [...e, { type: 'ai', content }]);

    } else if (type === 'approval_required') {
      let data = {};
      try { data = JSON.parse(content); } catch {}
      const agentName = agentNameFromSource(data.agent || 'config_agent');
      setAgentState(agentName, { state: 'MENUNGGU', task: `⊙ approval: ${data.tool || '?'}`, taskColor: 'var(--warn)' });
      setApprovalData(data);
      setModalOpen(true);
      setEvents(e => [...e, { type: 'approval_required', content: data }]);

    } else if (type === 'error') {
      setEvents(e => [...e, { type: 'error', content }]);
    }
  }

  async function handleSend(text) {
    resetAgents();
    setEvents(e => [...e, { type: 'user', text }]);
    await consumeStream('/chat', { thread_id: THREAD_ID, message: text });
  }

  async function approve() {
    setModalOpen(false);
    const agentName = agentNameFromSource(approvalData?.agent || 'config_agent');
    setAgentState(agentName, { state: 'BERJALAN', task: '⠹ executing…', taskColor: null });
    await consumeStream('/approve', { thread_id: THREAD_ID, decision: 'approved' });
  }

  async function reject() {
    setModalOpen(false);
    const agentName = agentNameFromSource(approvalData?.agent || 'config_agent');
    setAgentState(agentName, { state: 'GAGAL', task: '✗ ditolak operator', taskColor: 'var(--err)' });
    await consumeStream('/approve', { thread_id: THREAD_ID, decision: 'rejected' });
  }

  const activeCount = agents.filter(a => a.state === 'BERJALAN' || a.state === 'MENUNGGU').length;

  return (
    <div className="app">
      <TopBar thread={`thread/${THREAD_ID.slice(0,8)}`} ctx={0} tokens="—" time={time} />
      <div className="main">
        <LeftRail active={active} onNav={setActive} />
        <div className="chat-panel">
          <div className="chat-head">
            <span className="chat-head-title">AI Chat</span>
            <span className="chat-head-meta">{streaming ? '⠹ streaming…' : '● siap'}</span>
            <div className="chat-head-btns">
              <button className="btn-ghost" onClick={() => { setEvents([]); resetAgents(); }}>Clear</button>
            </div>
          </div>
          <div className="chat-stream" ref={streamRef}>
            {events.map((ev, i) => <ChatEvent key={i} ev={ev} />)}
            {streaming && events.length > 0 && <div className="ch-line ch-ev">  <span className="ch-caret"></span></div>}
          </div>
          <Composer onSend={handleSend} disabled={streaming} />
        </div>
        <div className="agent-rail">
          <div className="agent-rail-head">
            <span className="agent-rail-title">Agents</span>
            <span className="agent-rail-count">{activeCount}/6 active</span>
          </div>
          <div className="agent-rail-list">
            {agents.map(a => <AgentCard key={a.name} agent={a} />)}
          </div>
        </div>
      </div>
      <StatusBar
        status={modalOpen ? '⊙ APPROVAL PENDING' : streaming ? '⠹ streaming' : '● ready'}
        hint={<><kbd>↵</kbd>send <kbd>⇧↵</kbd>newline</>}
      />
      <ApprovalModal open={modalOpen} data={approvalData} onApprove={approve} onReject={reject} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
