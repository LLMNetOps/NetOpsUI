// ── State ───────────────────────────────────────────────────────────────────

function makeAgentStates() {
  const s = {};
  AGENTS.forEach(a => { s[a.alias] = { state:'standby', detail:'', toolCount:0 } });

}

// ── API ─────────────────────────────────────────────────────────────────────

async function apiCreateSession() {
  const r = await fetch('/session/new', { method:'POST' });
  return r.json();
}

async function apiStreamChat(threadId, message, onEvent) {
  const r = await fetch('/chat', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ thread_id: threadId, message }),
  });
  await consumeSSE(r, onEvent);
}

async function apiApprove(threadId, decision, onEvent) {
  const r = await fetch('/approve', {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ thread_id: threadId, decision }),
  });
  await consumeSSE(r, onEvent);
}

async function apiInfo() { return (await fetch('/info')).json(); }
async function apiStatus() { try { return (await fetch('/api/status')).json(); } catch { return null; } }

async function consumeSSE(response, onEvent) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buf = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += decoder.decode(value, { stream: true });
    const frames = buf.split('\n\n');
    buf = frames.pop();
    for (const frame of frames) {
      const line = frame.trim();
      if (!line || line.startsWith(':')) continue;
      if (line.startsWith('data: ')) {
        try { const p = JSON.parse(line.slice(6)); onEvent(p.type, p.content); } catch {}
      }
    }
  }
}

// ── Helpers ──────────────────────────────────────────────────────────────────

function esc(str) { const d = document.createElement('div'); d.textContent = str; return d.innerHTML; }
function fmtTime(date) {
  const d = date || new Date();
  const pad = n => String(n).padStart(2,'0');
  return pad(d.getHours())+':'+pad(d.getMinutes())+':'+pad(d.getSeconds());
}
function $(id) { return document.getElementById(id); }

// ── Component: Status Badge ─────────────────────────────────────────────────

function badge(label, v='green') {
  const c = {

    amber:'bg-amber-50 text-amber-700 border-amber-100',
    red:'bg-red-50 text-red-700 border-red-100',

    gray:'bg-surface-container text-on-surface-variant border-outline-variant',

  return `<span class="inline-flex items-center gap-1 px-2 py-0.5 text-label-caps font-label-caps font-bold border rounded-full ${c}">${label}</span>`;
}

    waiting:  { dot:'bg-amber-500', text:'text-amber-700',          label:'WAITING',  bl:'border-l-[3px] border-l-amber-500' },
    done:     { dot:'bg-gray-400',  text:'text-on-surface-variant', label:'DONE',     bl:'' },
    failed:   { dot:'bg-red-500',   text:'text-red-700',            label:'FAILED',   bl:'border-l-[3px] border-l-red-500' },
  };
  const st = styles[state] || styles.standby;
  const pulse = state==='running' ? 'pulse-green' : '';

    <div class="flex justify-between items-center">

    </div>
    ${detail ? `<p class="text-[10px] text-on-surface-variant font-data-mono-sm mt-1 truncate">${esc(detail)}</p>` : ''}
  </div>`;
}

// ── Data helpers (API fetch + rendering) ─────────────────────────────────────

async function apiGet(path) {
  const r = await fetch(path);
  if (!r.ok) throw new Error(`HTTP ${r.status} ${path}`);
  return r.json();
}
async function apiPost(path, body) {
  const r = await fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  if (!r.ok) throw new Error(`HTTP ${r.status} ${path}`);
  return r.json();
}
async function apiPut(path, body) {
  const r = await fetch(path, { method:'PUT', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body||{}) });
  if (!r.ok) throw new Error(`HTTP ${r.status} ${path}`);
  return r.json();
}
async function apiDelete(path) {
  const r = await fetch(path, { method:'DELETE' });
  if (!r.ok) throw new Error(`HTTP ${r.status} ${path}`);
  return r.json();
}

// Loading spinner block
function loadingHtml(msg='Loading...') {

// Subtle inline error banner
function errorHtml(msg) {

    <span class="material-symbols-outlined text-[18px]">error</span>

// Monospace result block for plain-text tool output
function preHtml(text) {
  return `<pre class="font-data-mono text-data-mono text-sm whitespace-pre-wrap">${esc(text||'')}</pre>`;
}
// Render plain-text result inside a card
function resultCard(title, text, headerRight) {
  return cardHtml(title, preHtml(text), headerRight);
}

// Parse list_routers() plain-text output into [{name, host, ros, role, servers}]
function parseRouterList(text) {
  if (!text) return [];
  const out = [];
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line || line.startsWith('Router yang tersedia')) continue;
    // Format: NAME  HOST  ROS vN  role=X  network=Y  servers: ...
    const m = line.match(/^(\S+)\s+(\S+)\s+ROS\s+(v\d+)/i);
    if (!m) continue;
    const role = (line.match(/role=(\S+)/)||[])[1] || '';
    const servers = (line.split('servers:')[1]||'').trim();
    out.push({ name:m[1], host:m[2], ros:m[3], role, servers });
  }
  return out;
}

function renderNav() {
  const nav = $('sidebar-nav');

      : 'text-surface-container-lowest/60 hover:bg-white/5 hover:text-surface-container-lowest border-l-[3px] border-transparent';
    const fill = active ? "font-variation-settings:'FILL' 1;" : '';
    return `<a class="${base} ${cls}" data-screen="${item.id}">
      <span class="material-symbols-outlined" style="${fill}">${item.icon}</span><span>${item.label}</span>

// ── Dashboard ───────────────────────────────────────────────────────────────

async function screenDashboard(c) {
  // Map agent name → icon (registry visuals fall back to default)
  const ICONS = {};
  AGENTS.forEach(a => { ICONS[a.name] = a.icon; });

  // Fetch all dashboard data in parallel; tolerate individual failures.
  const [statusR, agentsR, routersR] = await Promise.allSettled([
    apiGet('/api/status'),
    apiGet('/api/agents'),
    apiGet('/api/tools/routers'),
  ]);

  let st = statusR.status==='fulfilled' ? statusR.value : (S.systemStatus || {});
  if (statusR.status==='fulfilled') S.systemStatus = st;
  st = st || {};

  // Agent registry — real data when available, fall back to constant.
  let agentList = AGENTS.map(a => ({ name:a.name, alias:a.alias, role:a.role, icon:a.icon }));
  if (agentsR.status==='fulfilled' && Array.isArray(agentsR.value.agents) && agentsR.value.agents.length) {
    agentList = agentsR.value.agents.map(a => ({
      name: a.name,
      alias: a.alias || a.name,
      role: (a.description||'').split('.')[0].slice(0,28) || a.name,
      icon: ICONS[a.name] || 'smart_toy',
    }));
  }
  const agentCount = agentList.length;
  const agentCards = agentList.map(a =>
    `<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-3 shadow-sm text-center min-w-[120px]">
      <span class="material-symbols-outlined text-2xl text-primary mb-1">${a.icon}</span>
      <p class="text-xs font-bold uppercase text-primary">${esc(a.alias)}</p>
      <p class="text-[10px] text-on-surface-variant truncate">${esc(a.role)}</p>
    </div>`
  ).join('');

  // Router health rows from list_routers plain-text output.
  let routerRowsHtml = `<tr><td class="px-4 py-2 font-medium">—</td><td class="px-4 py-2 font-data-mono text-data-mono">—</td><td class="px-4 py-2">${badge('PENDING','gray')}</td></tr>`;
  let routerNote = 'Connect to backend to load router data.';
  if (routersR.status==='fulfilled') {
    const rows = parseRouterList(routersR.value.result);
    if (rows.length) {
      routerRowsHtml = rows.map(r => `<tr>
        <td class="px-4 py-2 font-medium">${esc(r.name)}</td>
        <td class="px-4 py-2 font-data-mono text-data-mono">${esc(r.host||'—')}</td>
        <td class="px-4 py-2">${badge('CONFIGURED','blue')}</td>
      </tr>`).join('');
      routerNote = `${rows.length} router(s) configured. Open Network to run reachability checks.`;
    } else {
      routerNote = 'No routers configured.';
    }
  } else {
    routerNote = 'Backend unavailable — showing placeholder.';
  }

  const ollamaTxt = st.ollama_url ? 'Online' : (st.ollama_host ? 'Online' : '—');

  c.innerHTML = `<div class="p-6 max-w-[1600px] mx-auto">
    <div class="flex justify-between items-end mb-6">
      <div>
        <h2 class="text-headline-md font-headline-md text-primary">Network Overview</h2>
        <p class="text-body-md text-on-surface-variant">Real-time status of autonomous agents and campus infrastructure.</p>
      </div>
    </div>
    <div class="grid grid-cols-4 gap-6 mb-6">
      ${statCardHtml('LLM MODEL', esc(st.model||'—'),'')}
      ${statCardHtml('OLLAMA', ollamaTxt,'','green')}
      ${statCardHtml('SKILLS', st.skills_loaded!=null?st.skills_loaded:'—','')}
      ${statCardHtml('AGENTS', String(agentCount), agentCount?`${agentCount} loaded`:'')}
    </div>
    ${cardHtml('Agent Registry', `<div class="flex gap-3 overflow-x-auto pb-2">${agentCards}</div>`)}
    <div class="grid grid-cols-2 gap-6 mt-6">
      ${cardHtml('Router Health', `
        <table class="w-full text-left">
          <thead class="bg-surface-container-low"><tr>
            <th class="px-4 py-2 text-label-caps font-label-caps text-outline">ROUTER</th>
            <th class="px-4 py-2 text-label-caps font-label-caps text-outline">HOST</th>
            <th class="px-4 py-2 text-label-caps font-label-caps text-outline">STATUS</th>
          </tr></thead>
          <tbody class="divide-y divide-outline-variant text-body-sm">
            ${routerRowsHtml}
          </tbody>
        </table>
        <p class="text-[11px] text-on-surface-variant mt-3">${esc(routerNote)}</p>
      `)}
      ${cardHtml('Quick Actions', `
        <div class="grid grid-cols-2 gap-3">
          <button onclick="location.hash='chat'" class="flex items-center gap-2 px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-body-sm font-medium text-primary">
            <span class="material-symbols-outlined text-lg">health_and_safety</span>Health Check</button>
          <button onclick="location.hash='chat'" class="flex items-center gap-2 px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-body-sm font-medium text-primary">
            <span class="material-symbols-outlined text-lg">shield</span>Security Audit</button>
          <button onclick="location.hash='chat'" class="flex items-center gap-2 px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-body-sm font-medium text-primary">
            <span class="material-symbols-outlined text-lg">backup</span>Backup All</button>
          <button onclick="location.hash='chat'" class="flex items-center gap-2 px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded-lg hover:bg-surface-container-low transition-colors text-body-sm font-medium text-primary">
            <span class="material-symbols-outlined text-lg">router</span>DHCP Audit</button>
        </div>
      `)}
    </div>

}

function chatBindEvents() {
  const inp = $('chat-input'), btnS = $('btn-send'), btnN = $('btn-new-thread');
  const btnA = $('btn-approve'), btnR = $('btn-reject');

  async function send() {
    const text = inp.value.trim();
    if (!text || S.chatState !== 'idle') return;
    inp.value = '';
    S.activeQuery = text;
    S.messages.push({ role:'user', content:text, ts:new Date(), events:[] });
    S.messages.push({ role:'agent', content:'', ts:new Date(), events:[], streaming:true });
    chatResetAgents();
    chatStartElapsed();
    S.chatState = 'streaming';
    chatRenderMessages(); chatUpdateUI();
    try { await apiStreamChat(S.threadId, text, chatHandleEvent); }
    catch(e) { chatHandleEvent('error', e.message||'Connection failed'); }
    chatFinish();
  }

  btnS.onclick = send;
  inp.onkeydown = e => {
    if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    if (e.key==='l' && e.ctrlKey) { e.preventDefault(); chatClear(); }
  };
  btnN.onclick = async () => {
    try { const r = await apiCreateSession(); S.threadId = r.thread_id; S.threads.push({id:r.thread_id,title:'New Chat',ts:new Date()}); }
    catch { S.threadId = crypto.randomUUID(); }
    chatClear();
  };
  btnA.onclick = () => chatResolveApproval('approved');
  btnR.onclick = () => chatResolveApproval('rejected');

  document.addEventListener('keydown', function _ak(e) {
    if (S.chatState !== 'approval') return;
    if (e.key==='y'||e.key==='Y') chatResolveApproval('approved');
    if (e.key==='n'||e.key==='N') chatResolveApproval('rejected');
  });
}

function chatHandleEvent(type, content) {
  const last = S.messages[S.messages.length-1];
  if (!last || last.role !== 'agent') return;
  if (type === 'ai') {
    last.content += (last.content?'\n':'')+content;
  } else if (type === 'approval_required') {
    S.chatState = 'approval';
    try { S.pendingApproval = JSON.parse(content); } catch { S.pendingApproval = {action:content}; }
    chatShowApproval();
  } else {
    last.events.push({ type, content, ts:new Date() });
    chatUpdateAgentFromEvent(type, content);
    if (type==='tool_call') S.toolCount++;
  }
  chatRenderMessages(); chatUpdateUI();
}

async function chatResolveApproval(decision) {
  chatHideApproval();
  const last = S.messages[S.messages.length-1];
  if (last) last.events.push({type:'routing',content:`Operator: ${decision==='approved'?'DISETUJUI':'DITOLAK'}`,ts:new Date()});
  S.chatState = 'streaming';
  chatRenderMessages();
  try { await apiApprove(S.threadId, decision, chatHandleEvent); }
  catch(e) { chatHandleEvent('error', e.message); }
  chatFinish();
}

function chatFinish() {
  const last = S.messages[S.messages.length-1];
  if (last) last.streaming = false;
  S.chatState = 'idle';
  chatStopElapsed();
  AGENTS.forEach(a => { if (S.agents[a.alias].state==='running') S.agents[a.alias].state='done'; });
  chatRenderMessages(); chatRenderAgents(); chatUpdateUI();
}

function chatClear() {
  S.messages=[]; S.activeQuery=''; S.toolCount=0; S.chatState='idle';
  Object.keys(S.agents).forEach(k => { S.agents[k]={state:'standby',detail:'',toolCount:0}; });
  chatStopElapsed();
  chatRenderMessages(); chatRenderAgents(); chatRenderThreads(); chatUpdateUI();
}

function chatResetAgents() {
  Object.keys(S.agents).forEach(k => { S.agents[k]={state:'standby',detail:'',toolCount:0}; });
  S.agents.bambang = {state:'running',detail:'routing...',toolCount:0};
  S.toolCount = 0;
  chatRenderAgents();
}

function chatUpdateAgentFromEvent(type, content) {
  const m = content.match(/^\[(\w+)\]\s*(.*)/);
  if (!m) return;
  const alias = ROLE_TO_ALIAS[m[1]] || m[1];
  const msg = m[2];
  if (type==='routing' && msg.startsWith('→')) {
    if (S.agents[alias]) S.agents[alias].state='done';
    const tgt = msg.match(/→\s*(\w+)/)?.[1];
    const ta = ROLE_TO_ALIAS[tgt];
    if (ta && S.agents[ta]) { S.agents[ta].state='running'; S.agents[ta].detail=''; }
  } else if (type==='tool_call') {
    if (S.agents[alias]) { S.agents[alias].state='running'; S.agents[alias].detail=msg.split('(')[0]; S.agents[alias].toolCount++; }
  } else if (type==='error') {
    if (S.agents[alias]) S.agents[alias].state='failed';
  }
  chatRenderAgents();
}

function chatShowApproval() {
  const o = $('approval-overlay'); if (!o) return; o.classList.remove('hidden');

    ar.innerHTML=`<span class="px-2 py-0.5 text-[10px] font-bold border rounded-full ${cls}">${lv}</span>`; }
}
function chatHideApproval() { const o=$('approval-overlay'); if(o) o.classList.add('hidden'); S.pendingApproval=null; }

function chatStartElapsed() {
  S.elapsed=0; chatStopElapsed(); const st=Date.now();
  _elapsedIv = setInterval(()=>{
    S.elapsed = Math.floor((Date.now()-st)/1000);
    const el=$('elapsed-display'); if(el){const m=String(Math.floor(S.elapsed/60)).padStart(2,'0'),s=String(S.elapsed%60).padStart(2,'0'); el.textContent=`⏱ ${m}:${s}`;}
  },1000);
}
function chatStopElapsed() { if(_elapsedIv){clearInterval(_elapsedIv);_elapsedIv=null;} }
function chatUpdateUI() { const q=$('active-query'); if(q) q.textContent=S.activeQuery||'—'; }

function chatUnmount() { chatStopElapsed(); }

  // Run reachability against all routers and update the router table.
  async function runReachability() {
    const body = $('net-router-body');
    const btn = $('net-refresh');
    if (btn) btn.disabled = true;
    if (body) body.innerHTML = `<tr><td class="py-6 px-2 text-center text-on-surface-variant" colspan="7">${loadingHtml('Memeriksa reachability...')}</td></tr>`;
    try {
      const r = await apiPost('/api/tools/reachability/all', {});
      const results = r.results || {};
      const newRows = routers.map(rt => {
        const txt = results[rt.name] || '';
        const ok = /reachable|up|online|berhasil|ping ok|alive|0% packet loss|success/i.test(txt) && !/unreachable|gagal|fail|timeout|100% packet loss/i.test(txt);
        const down = /unreachable|gagal|fail|timeout|100% packet loss/i.test(txt);
        const status = down ? 'red' : ok ? 'green' : 'amber';
        const st = down ? 'OFFLINE' : ok ? 'ONLINE' : 'UNKNOWN';
        return `<tr class="hover:bg-surface-container-low transition-colors group">
          <td class="py-3 px-2"><div class="flex items-center gap-2"><span class="material-symbols-outlined text-outline text-[18px]">router</span><span class="font-data-mono text-data-mono font-medium text-primary">${esc(rt.name)}</span></div></td>
          <td class="py-3 px-2 font-data-mono text-data-mono text-on-surface-variant">${esc(rt.host)}</td>
          <td class="py-3 px-2">${badge(st, status)}</td>
          <td class="py-3 px-2 font-data-mono-sm text-data-mono-sm text-on-surface-variant truncate max-w-[260px]" title="${esc(txt)}">${esc((txt||'—').split('\n')[0].slice(0,60))}</td>
          <td class="py-3 px-2 text-on-surface-variant" colspan="3">—</td>
        </tr>`;
      }).join('');
      if (body) body.innerHTML = newRows;
    } catch (e) {
      if (body) body.innerHTML = `<tr><td class="py-4 px-2 text-red-700 text-body-sm" colspan="7">Gagal: ${esc(e.message)}</td></tr>`;
    } finally {
      if (btn) btn.disabled = false;
    }
  }

  const refreshBtn = $('net-refresh');
  if (refreshBtn) refreshBtn.onclick = runReachability;
  const hcBtn = $('net-healthcheck');
  if (hcBtn) hcBtn.onclick = () => { location.hash = 'chat'; };
}

async function screenMetrics(c) {
  const statusPill = (label, cls) => {
    const c2 = cls==='amber' ? 'bg-[#FEF3C7] text-[#92400E]' : (cls==='red' ? 'bg-red-100 text-red-700' : 'bg-[#DCFCE7] text-[#166534]');
    const dot = cls==='amber' ? 'bg-[#92400E]' : (cls==='red' ? 'bg-red-600' : 'bg-[#166534]');
    return `<span class="inline-flex items-center gap-1 px-2 py-0.5 rounded-full ${c2} font-bold text-[10px] uppercase"><span class="w-1.5 h-1.5 rounded-full ${dot}"></span> ${label}</span>`;
  };
  const nf = n => (n||0).toLocaleString('en-US');

  // Fetch raw metric entries; aggregate per agent.
  let entries = [];
  let metricsErr = '';
  try { entries = await apiGet('/metrics?n=100'); if (!Array.isArray(entries)) entries = []; }
  catch (e) { metricsErr = 'Gagal memuat metrik: ' + e.message; }

  // Aggregate per agent.
  const agg = {};
  for (const e of entries) {
    const name = e.agent || 'unknown';
    const a = agg[name] || (agg[name] = { name, calls:0, ctxSum:0, tpsSum:0, predSum:0, genSum:0, promptSum:0 });
    a.calls += 1;
    a.ctxSum += (e.ctx_util||0);
    a.tpsSum += (e.tps||0);
    a.predSum += (e.predict_util||0);
    a.genSum += (e.gen_tokens||0);
    a.promptSum += (e.prompt_tokens||0);
  }
  const ROLE_ALIAS = {};
  AGENTS.forEach(x => { ROLE_ALIAS[x.name] = x.alias; });
  const agents = Object.values(agg).map(a => {
    const ctx = a.calls ? Math.round(a.ctxSum / a.calls) : 0;
    const tps = a.calls ? (a.tpsSum / a.calls) : 0;
    const cls = ctx >= 90 ? 'red' : (ctx >= 75 ? 'amber' : 'green');
    const st = ctx >= 90 ? 'Throttled' : (ctx >= 75 ? 'High Load' : 'Optimal');
    const alias = ROLE_ALIAS[a.name];
    return {
      name: alias ? `${a.name} (${alias})` : a.name,
      calls: a.calls, ctx, tps: tps.toFixed(1), st, cls,
      predict: a.calls ? Math.round(a.predSum / a.calls) : 0,
    };
  }).sort((x,y) => y.calls - x.calls);

  // Totals for stat cards.
  const totalCalls = entries.length;
  const avgCtx = entries.length ? (entries.reduce((s,e)=>s+(e.ctx_util||0),0)/entries.length) : 0;
  const tpsVals = entries.map(e=>e.tps||0).filter(v=>v>0);
  const meanTps = tpsVals.length ? (tpsVals.reduce((s,v)=>s+v,0)/tpsVals.length) : 0;
  const warnings = entries.filter(e => (e.ctx_util||0) >= 90 || (e.done_reason && e.done_reason !== 'stop')).length;

  const rows = agents.length
    ? agents.map((a,i) => `<tr class="${i%2?'bg-[#F8FAFC]':''}">
        <td class="px-6 py-4 font-medium">${esc(a.name)}</td>
        <td class="px-6 py-4 text-right font-data-mono">${nf(a.calls)}</td>
        <td class="px-6 py-4">
          <div class="flex items-center gap-2">
            <div class="flex-1 h-2 bg-surface-container rounded-full overflow-hidden max-w-[80px]"><div class="h-full ${a.ctx>=90?'bg-[#ba1a1a]':'bg-primary-container'}" style="width:${Math.min(a.ctx,100)}%;"></div></div>
            <span class="font-data-mono-sm text-data-mono-sm ${a.ctx>=90?'text-[#ba1a1a]':''}">${a.ctx}%</span>
          </div>
        </td>
        <td class="px-6 py-4 text-center font-data-mono">${a.predict}%</td>
        <td class="px-6 py-4 text-right font-data-mono">${a.tps}</td>
        <td class="px-6 py-4">${statusPill(a.st, a.cls)}</td>
      </tr>`).join('')
    : `<tr><td colspan="6" class="px-6 py-8 text-center text-on-surface-variant text-body-sm">Belum ada data metrik token.</td></tr>`;

  c.innerHTML = `<div class="p-container_gutter max-w-[1600px] mx-auto">
    ${pageHeader('Operational Token Analytics', 'Per-agent token consumption, context pressure, and throughput.', `
      <button class="flex items-center gap-2 px-4 py-2 bg-surface-container-lowest border border-outline-variant text-primary font-body-md rounded-lg hover:bg-surface-container transition-colors"><span class="material-symbols-outlined text-lg">download</span> Export CSV</button>
      <button id="metrics-refresh" class="flex items-center gap-2 px-4 py-2 bg-secondary text-white font-body-md rounded-lg shadow-sm hover:opacity-90 transition-all"><span class="material-symbols-outlined text-lg">refresh</span> Live Refresh</button>`)}
    ${metricsErr ? errorHtml(metricsErr) : ''}

    <!-- Stat Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-stack_gap_lg">
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-2"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant">Total LLM Calls</span><span class="material-symbols-outlined text-primary-container opacity-50">call_made</span></div>
          <div class="font-display-lg text-display-lg text-primary">${nf(totalCalls)}</div>
        </div>
        <div class="mt-4 flex items-center gap-1 text-[11px] font-bold text-on-surface-variant"><span class="material-symbols-outlined text-sm">history</span> last 100 samples</div>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-2"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant">Avg Context Usage</span><span class="material-symbols-outlined text-primary-container opacity-50">data_thresholding</span></div>
          <div class="font-display-lg text-display-lg text-primary">${avgCtx.toFixed(1)}%</div>
        </div>
        <div class="mt-4 h-1.5 w-full bg-surface-container rounded-full overflow-hidden"><div class="h-full bg-primary-container" style="width:${Math.min(avgCtx,100).toFixed(1)}%;"></div></div>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-2"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant">Mean Speed</span><span class="material-symbols-outlined text-primary-container opacity-50">bolt</span></div>
          <div class="font-display-lg text-display-lg text-primary">${meanTps.toFixed(1)} <span class="text-body-md font-normal text-on-surface-variant">tok/s</span></div>
        </div>
        <div class="mt-4 flex items-center gap-1 text-[11px] font-bold text-on-surface-variant"><span class="material-symbols-outlined text-sm">speed</span> generation throughput</div>
      </div>
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-5 flex flex-col justify-between">
        <div>
          <div class="flex justify-between items-start mb-2"><span class="font-label-caps text-label-caps uppercase text-on-surface-variant">Context Warnings</span><span class="material-symbols-outlined text-[#92400E]">warning</span></div>
          <div class="font-display-lg text-display-lg ${warnings?'text-[#92400E]':'text-primary'}">${warnings}</div>
        </div>
        <div class="mt-4 flex items-center gap-1 text-[11px] font-bold text-on-surface-variant"><span class="material-symbols-outlined text-sm">schedule</span> high-pressure samples</div>
      </div>
    </div>

    <!-- Per-Agent Resource Allocation -->
    <div class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
      <div class="px-6 py-4 border-b border-outline-variant flex justify-between items-center">
        <h3 class="font-title-sm text-title-sm text-primary">Per-Agent Resource Allocation</h3>
        <span class="px-2 py-1 ${agents.length?'bg-green-100 text-green-800':'bg-surface-container text-on-surface-variant'} text-[10px] font-bold rounded">${agents.length} AGENT(S) WITH METRICS</span>
      </div>
      <div class="overflow-x-auto">
        <table class="w-full text-left border-collapse">
          <thead>
            <tr class="bg-surface-container-low border-b border-outline-variant">
              <th class="px-6 py-3 font-label-caps text-label-caps uppercase text-on-surface-variant">Agent Name</th>
              <th class="px-6 py-3 font-label-caps text-label-caps uppercase text-on-surface-variant text-right">LLM Calls</th>
              <th class="px-6 py-3 font-label-caps text-label-caps uppercase text-on-surface-variant">CTX Usage %</th>
              <th class="px-6 py-3 font-label-caps text-label-caps uppercase text-on-surface-variant text-center">PRED Util %</th>
              <th class="px-6 py-3 font-label-caps text-label-caps uppercase text-on-surface-variant text-right">TPS (Avg)</th>
              <th class="px-6 py-3 font-label-caps text-label-caps uppercase text-on-surface-variant">Status</th>
            </tr>
          </thead>
          <tbody class="font-body-sm text-on-surface divide-y divide-outline-variant/30">${rows}</tbody>
        </table>
      </div>
      <div class="px-6 py-3 bg-surface-container-low flex justify-between items-center text-on-surface-variant">
        <span class="text-label-caps">${agents.length} agent(s) · ${nf(totalCalls)} samples</span>
      </div>
    </div>
  </div>`;

  const refreshBtn = document.getElementById('metrics-refresh');
  if (refreshBtn) refreshBtn.onclick = () => screenMetrics(c);
}

// ── Settings ─────────────────────────────────────────────────────────────────

function settingsTab(tabId) {
  document.querySelectorAll('.settings-pane').forEach(p => p.classList.add('hidden'));
  document.querySelectorAll('button[data-stab]').forEach(t => {
    t.classList.remove('border-b-2','border-primary','text-primary','font-semibold');
    t.classList.add('text-on-surface-variant');
  });
  const pane = $('settings-content-' + tabId);
  if (pane) pane.classList.remove('hidden');
  const tab = document.querySelector(`button[data-stab="${tabId}"]`);
  if (tab) { tab.classList.add('border-b-2','border-primary','text-primary','font-semibold'); tab.classList.remove('text-on-surface-variant'); }
}

async function screenSettings(c) {
  const tab = (id, label, active) => `<button data-stab="${id}" onclick="settingsTab('${id}')" class="pb-3 px-1 text-body-md transition-all ${active?'border-b-2 border-primary text-primary font-semibold':'text-on-surface-variant hover:text-primary'}">${label}</button>`;

  c.innerHTML = `<div class="p-container_gutter max-w-[1400px] mx-auto">
    ${pageHeader('System Settings', 'Configure global parameters for autonomous network operations.', `
      <button class="px-4 py-2 border border-primary text-primary font-medium text-body-md rounded-md hover:bg-surface-container transition-colors">Discard changes</button>
      <button class="px-4 py-2 bg-secondary text-white font-medium text-body-md rounded-md hover:bg-secondary/90 transition-colors">Save changes</button>`)}

    <!-- Tabs -->
    <div class="border-b border-outline-variant mb-stack_gap_lg flex gap-8">
      ${tab('routers','Routers',true)}
      ${tab('agents','Agents',false)}
      ${tab('environment','Environment',false)}
      ${tab('netbox','NetBox',false)}
      ${tab('memory','Memory',false)}
    </div>

    <!-- Routers -->
    <div class="settings-pane" id="settings-content-routers">
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden">
        <div class="p-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
          <h3 class="font-title-sm text-title-sm text-primary">Managed Router Hosts</h3>
          <button id="settings-add-router" class="text-secondary font-medium text-body-sm flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">add</span> Add Host</button>
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse">
            <thead class="bg-surface-container-low">
              <tr>
                <th class="p-3 text-label-caps font-bold text-on-surface-variant border-b border-outline-variant">Hostname</th>
                <th class="p-3 text-label-caps font-bold text-on-surface-variant border-b border-outline-variant">Management IP</th>
                <th class="p-3 text-label-caps font-bold text-on-surface-variant border-b border-outline-variant">SSH User</th>
                <th class="p-3 text-label-caps font-bold text-on-surface-variant border-b border-outline-variant text-right">Actions</th>
              </tr>
            </thead>
            <tbody id="settings-router-body" class="text-body-md"><tr><td colspan="4">${loadingHtml('Memuat router...')}</td></tr></tbody>
          </table>
        </div>
      </div>
    </div>

    <!-- Agents -->
    <div class="settings-pane hidden" id="settings-content-agents">
      <div id="settings-agents-grid" class="grid grid-cols-1 lg:grid-cols-2 xl:grid-cols-3 gap-6">${loadingHtml('Memuat agent...')}</div>
    </div>

    <!-- Environment -->
    <div class="settings-pane hidden" id="settings-content-environment">
      <div class="max-w-2xl bg-surface-container-lowest border border-outline-variant rounded-lg p-stack_gap_lg shadow-sm">
        <div class="flex items-center gap-4 mb-6">
          <div class="w-16 h-16 bg-primary/10 rounded-lg border border-outline-variant flex items-center justify-center"><span class="material-symbols-outlined text-primary text-3xl">dns</span></div>
          <div><h3 class="font-title-sm text-title-sm text-primary">Ollama Configuration</h3><p class="text-body-sm text-on-surface-variant">Configure the local inference engine connection parameters.</p></div>
        </div>
        <div class="space-y-6">
          <div>
            <label class="text-body-md font-medium text-primary block mb-2">Base API URL</label>
            <div class="flex gap-2">
              <input id="settings-ollama-url" class="flex-1 text-body-sm bg-surface-container-lowest border border-outline-variant rounded-md px-3 py-2 focus:ring-2 focus:ring-primary/10" type="text" value="http://localhost:11434"/>
            </div>
            <p class="text-[11px] text-on-surface-variant mt-1">Sumber: variabel lingkungan OLLAMA_BASE_URL.</p>
          </div>
          <div>
            <label class="text-body-md font-medium text-primary block mb-2">Default Inference Model</label>
            <input id="settings-ollama-model" class="w-full text-body-sm bg-surface-container-lowest border border-outline-variant rounded-md px-3 py-2 focus:ring-2 focus:ring-primary/10" type="text" value=""/>
          </div>
          <div class="p-4 bg-surface-container-low rounded-lg border border-outline-variant flex items-start gap-3">
            <span class="material-symbols-outlined text-on-secondary-container">info</span>
            <div class="text-body-sm text-on-surface-variant">Inference is currently set to <span class="font-bold">local-only</span>. Edit .env untuk mengubah konfigurasi.</div>
          </div>
        </div>
      </div>
    </div>

    <!-- NetBox -->
    <div class="settings-pane hidden" id="settings-content-netbox">
      <div class="max-w-2xl bg-surface-container-lowest border border-outline-variant rounded-lg p-stack_gap_lg shadow-sm">
        <div class="mb-6 border-b border-outline-variant pb-4"><h3 class="font-title-sm text-title-sm text-primary">Source of Truth (NetBox)</h3><p class="text-body-sm text-on-surface-variant">Connect to your NetBox instance for topology discovery.</p></div>
        <div class="space-y-6">
          <div><label class="text-body-md font-medium text-primary block mb-1">Instance URL</label><input class="w-full text-body-sm bg-surface-container-lowest border border-outline-variant rounded-md px-3 py-2 focus:ring-2 focus:ring-primary/10" type="text" placeholder="https://netbox.example.com"/></div>
          <div>
            <label class="text-body-md font-medium text-primary block mb-1">API Token</label>
            <div class="relative"><input class="w-full text-body-sm bg-surface-container-lowest border border-outline-variant rounded-md px-3 py-2 focus:ring-2 focus:ring-primary/10" type="password" placeholder="••••••••"/><button class="absolute right-3 top-1/2 -translate-y-1/2 text-on-surface-variant"><span class="material-symbols-outlined text-[20px]">visibility</span></button></div>
          </div>
          <div class="pt-4 flex items-center justify-between border-t border-outline-variant">
            <div class="flex items-center gap-2"><div class="w-2 h-2 rounded-full bg-outline"></div><span class="text-body-sm text-on-surface-variant font-medium">Konfigurasi NetBox via .env</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Memory -->
    <div class="settings-pane hidden" id="settings-content-memory">
      <div class="bg-surface-container-lowest border border-outline-variant rounded-lg overflow-hidden shadow-sm">
        <div class="p-4 border-b border-outline-variant flex justify-between items-center bg-surface-container-low">
          <div><h3 class="font-title-sm text-title-sm text-primary">Router Context Facts</h3><p class="text-[11px] text-on-surface-variant">Long-term semantic memory for network topology.</p></div>
          <button id="settings-memory-refresh" class="px-3 py-1 bg-primary text-white text-body-sm font-medium rounded hover:bg-primary/90 transition-colors flex items-center gap-1"><span class="material-symbols-outlined text-[18px]">refresh</span> Refresh</button>
        </div>
        <div id="settings-memory-body" class="p-4">${loadingHtml('Memuat memori...')}</div>
      </div>
    </div>
  </div>`;

  // ── Routers tab ────────────────────────────────────────────────────────────
  async function loadRouters() {
    const body = document.getElementById('settings-router-body');
    if (body) body.innerHTML = `<tr><td colspan="4">${loadingHtml('Memuat router...')}</td></tr>`;
    try {
      const r = await apiGet('/api/config/routers');
      const routers = r.routers || [];
      const user = r.ssh_username || '';
      if (!routers.length) {
        if (body) body.innerHTML = `<tr><td colspan="4" class="p-4 text-center text-on-surface-variant text-body-sm">Belum ada router. Klik "Add Host".</td></tr>`;
        return;
      }
      if (body) body.innerHTML = routers.map(rt => `<tr class="even:bg-surface-container-low hover:bg-surface-container transition-colors" data-router="${esc(rt.name)}">
        <td class="p-3 border-b border-outline-variant font-medium">${esc(rt.name)}</td>
        <td class="p-3 border-b border-outline-variant font-data-mono text-data-mono"><input data-field="host" class="bg-transparent border-none focus:ring-0 w-full p-0" type="text" value="${esc(rt.host||'')}"/></td>
        <td class="p-3 border-b border-outline-variant">${esc(user)}</td>
        <td class="p-3 border-b border-outline-variant text-right whitespace-nowrap">
          <button data-act="test" class="px-3 py-1 bg-primary-container text-on-primary-container text-body-sm rounded hover:bg-primary transition-colors">Test</button>
          <button data-act="save" class="px-3 py-1 ml-1 bg-secondary text-white text-body-sm rounded hover:opacity-90 transition-colors">Save</button>
          <button data-act="delete" class="px-3 py-1 ml-1 border border-error text-error text-body-sm rounded hover:bg-error-container transition-colors">Delete</button>
        </td>
      </tr>`).join('');
    } catch (e) {
      if (body) body.innerHTML = `<tr><td colspan="4" class="p-4">${errorHtml('Gagal memuat router: ' + e.message)}</td></tr>`;
    }
  }

  // Delegated handlers for router row actions.
  const routerBody = document.getElementById('settings-router-body');
  if (routerBody) routerBody.onclick = async (ev) => {
    const btn = ev.target.closest('button[data-act]');
    if (!btn) return;
    const tr = btn.closest('tr[data-router]');
    const name = tr.dataset.router;
    const hostInput = tr.querySelector('input[data-field="host"]');
    const act = btn.dataset.act;
    btn.disabled = true;
    const orig = btn.textContent;
    btn.textContent = '...';
    try {
      if (act === 'test') {
        const r = await apiPost('/api/tools/reachability', { router_name: name });
        alert(`${name}:\n` + (r.result || 'no result'));
      } else if (act === 'save') {
        await apiPut('/api/config/routers/' + encodeURIComponent(name), { field: 'host', value: hostInput.value });
        alert(`Router ${name} diperbarui.`);
      } else if (act === 'delete') {
        if (confirm(`Hapus router ${name}?`)) { await apiDelete('/api/config/routers/' + encodeURIComponent(name)); await loadRouters(); return; }
      }
    } catch (e) {
      alert('Gagal: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.textContent = orig;
    }
  };

  const addBtn = document.getElementById('settings-add-router');
  if (addBtn) addBtn.onclick = async () => {
    const name = prompt('Nama router:');
    if (!name) return;
    const host = prompt('Host / IP:');
    if (!host) return;
    try {
      await apiPost('/api/config/routers', { name, host, ros_version: 7, dhcp_servers: [] });
      await loadRouters();
    } catch (e) { alert('Gagal menambah router: ' + e.message); }
  };

  // ── Agents tab ─────────────────────────────────────────────────────────────
  const AGENT_ICONS = {};
  AGENTS.forEach(a => { AGENT_ICONS[a.name] = a.icon; });
  async function loadAgents() {
    const grid = document.getElementById('settings-agents-grid');
    try {
      const r = await apiGet('/api/agents');
      const agents = r.agents || [];
      if (!agents.length) { grid.innerHTML = `<p class="text-body-sm text-on-surface-variant">Tidak ada agent terdaftar.</p>`; return; }
      grid.innerHTML = agents.map(a => `<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-stack_gap_md flex flex-col shadow-sm">
        <div class="flex items-center justify-between mb-4">
          <div class="flex items-center gap-3"><div class="w-10 h-10 bg-primary/10 rounded flex items-center justify-center"><span class="material-symbols-outlined text-primary">${AGENT_ICONS[a.name]||'smart_toy'}</span></div><h4 class="font-title-sm text-title-sm text-primary">${esc(a.name)}${a.alias?` (${esc(a.alias)})`:''}</h4></div>
        </div>
        <div class="space-y-4 flex-1">
          <p class="text-body-sm text-on-surface-variant">${esc(a.description||'')}</p>
          <div><label class="text-label-caps text-on-surface-variant block mb-1">Base Model</label><input class="w-full text-body-sm bg-surface-container-low border border-outline-variant rounded p-2" type="text" value="${esc(a.model||'')}" readonly/></div>
          <div class="grid grid-cols-2 gap-3">
            <div><label class="text-label-caps text-on-surface-variant block mb-1">Context Length</label><input class="w-full text-body-sm bg-surface-container-low border border-outline-variant rounded p-2" type="number" value="${a.num_ctx||0}" readonly/></div>
            <div><label class="text-label-caps text-on-surface-variant block mb-1">Timeout (s)</label><input class="w-full text-body-sm bg-surface-container-low border border-outline-variant rounded p-2" type="number" value="${a.timeout||0}" readonly/></div>
          </div>
          <div><label class="text-label-caps text-on-surface-variant block mb-1">Enabled Tools (${(a.tools||[]).length})</label><div class="flex flex-wrap gap-2 mt-1">${(a.tools||[]).map(t=>`<span class="px-2 py-1 bg-surface-container border border-outline-variant rounded text-[11px] font-medium">${esc(t)}</span>`).join('') || '<span class="text-[11px] text-on-surface-variant">—</span>'}</div></div>
          ${(a.skills||[]).length ? `<div><label class="text-label-caps text-on-surface-variant block mb-1">Skills</label><div class="flex flex-wrap gap-2 mt-1">${a.skills.map(s=>`<span class="px-2 py-1 bg-primary-container/40 border border-outline-variant rounded text-[11px] font-medium">${esc(s)}</span>`).join('')}</div></div>` : ''}
        </div>
      </div>`).join('');
    } catch (e) {
      grid.innerHTML = errorHtml('Gagal memuat agent: ' + e.message);
    }
  }

  // ── Memory tab ─────────────────────────────────────────────────────────────
  async function loadMemory() {
    const body = document.getElementById('settings-memory-body');
    if (body) body.innerHTML = loadingHtml('Memuat memori...');
    try {
      const r = await apiGet('/api/memory');
      if (body) body.innerHTML = `<div class="max-h-[500px] overflow-auto">${preHtml(r.result || 'Belum ada fakta tersimpan.')}</div>`;
    } catch (e) {
      if (body) body.innerHTML = errorHtml('Gagal memuat memori: ' + e.message);
    }
  }
  const memBtn = document.getElementById('settings-memory-refresh');
  if (memBtn) memBtn.onclick = loadMemory;

  // ── Environment tab (read-only from /api/status) ───────────────────────────
  async function loadEnv() {
    try {
      const st = await apiGet('/api/status');
      const u = document.getElementById('settings-ollama-url');
      const m = document.getElementById('settings-ollama-model');
      if (u && st.ollama_url) u.value = st.ollama_url;
      if (m && st.model) m.value = st.model;
    } catch {}
  }

  // Kick off all fetches in parallel.
  loadRouters();
  loadAgents();
  loadMemory();
  loadEnv();
}

// ═══════════════════════════════════════════════════════════════════════════
// Router
// ═══════════════════════════════════════════════════════════════════════════

let _currentUnmount = null;

function navigate(id) {
  if (_currentUnmount) { _currentUnmount(); _currentUnmount=null; }
  S.screen = id;
  renderNav();
  const bc = $('breadcrumb-page');
  if (bc) { const n=NAV_ITEMS.find(i=>i.id===id); bc.textContent=n?n.label:id; }
  const c = $('screen-container');
  switch(id) {
    case 'dashboard': screenDashboard(c); break;
    case 'chat': screenChat(c); _currentUnmount=chatUnmount; break;
    case 'network': screenNetwork(c); break;
    case 'dhcp': screenDHCP(c); break;
    case 'netbox': screenNetBox(c); break;
    case 'skills': screenSkills(c); break;
    case 'reports': case 'backups': screenReports(c); break;
    case 'metrics': screenMetrics(c); break;
    case 'settings': screenSettings(c); break;
    default: screenPlaceholder(c, id); break;
  }
}

function onHash() { navigate(location.hash.slice(1)||'dashboard'); }

// ── Boot ────────────────────────────────────────────────────────────────────

renderShell();
onHash();
window.addEventListener('hashchange', onHash);

</script>
